<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de Oficiales</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      color: #14213d;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 25px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .contenedor {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
      text-align: center;
    }

    button {
      background: #0b1f3a;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Cámara de Oficiales</h1>
    <p>Sistema de Cantina</p>
  </header>

  <div class="contenedor">
    <div class="tarjeta">
      <h2>Sistema en construcción</h2>
      <p>El sistema de consumo e inventario estará disponible próximamente.</p>
      <button>Ingresar</button>
    </div>
  </div>

</body>
</html>
